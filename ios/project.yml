name: FlirtPilot
options:
  bundleIdPrefix: com.flirtpilot
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  FlirtPilot:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: FlirtPilotKeyboard
        embed: true
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: FlirtPilot Pilot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  FlirtPilotKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: [KeyboardAPI.swift]
      - path: PilotCore/Sources/PilotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flirtpilot.FlirtPilot.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: FlirtPilot Pilot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
schemes:
  FlirtPilot:
    build:
      targets:
        FlirtPilot: all
