name: FlirtPilot
options:
  bundleIdPrefix: com.flirtpilot
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  FlirtPilot:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: FlirtPilotKeyboard
        embed: true
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: FlirtPilot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SharedKeychainGroup: $(AppIdentifierPrefix)com.flirtpilot.shared
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.flirtpilot.shared]
        keychain-access-groups: [$(AppIdentifierPrefix)com.flirtpilot.shared]
  FlirtPilotKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flirtpilot.FlirtPilot.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: FlirtPilot
        SharedKeychainGroup: $(AppIdentifierPrefix)com.flirtpilot.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Generated/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.flirtpilot.shared]
        keychain-access-groups: [$(AppIdentifierPrefix)com.flirtpilot.shared]
schemes:
  FlirtPilot:
    build:
      targets:
        FlirtPilot: all
