name: Validate FlirtPilot
on:
  push:
    branches: [main, "feat/**", "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:vercel
      - name: Validate offline keyboard core and Swift syntax (no app deployment)
        run: |
          docker run --rm -v "$PWD/ios:/src" -w /src swift:6.0-jammy sh -c 'swift test --package-path PilotCore && swiftc -frontend -parse App/FlirtPilotApp.swift Keyboard/KeyboardViewController.swift Keyboard/WordSuggestions.swift PilotCore/Sources/PilotCore/OfflineEditor.swift'
