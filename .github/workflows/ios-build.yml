name: Validate iPhone keyboard (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned app and keyboard for simulator
        working-directory: ios
        run: xcodebuild -project FlirtPilot.xcodeproj -scheme FlirtPilot -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone pilot for private signing
        working-directory: ios
        run: |
          xcodebuild -project FlirtPilot.xcodeproj -scheme FlirtPilot -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
          mkdir -p PilotArtifacts/Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/FlirtPilot.app PilotArtifacts/Payload/
          cd PilotArtifacts
          zip -qry FlirtPilot-Pilot-UNSIGNED.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FlirtPilot-Pilot-UNSIGNED
          path: ios/PilotArtifacts/FlirtPilot-Pilot-UNSIGNED.ipa
          retention-days: 7
